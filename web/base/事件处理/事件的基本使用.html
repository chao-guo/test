<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../vue.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="app">
        <div>{{message}}</div>
        <button @click="showAlert">点击</button>
    </div>
    <script>
        let vm = new Vue({
            el: "#app",
            data: function () {
                return {
                    message: "Hello world!"
                }
            },
            methods: {
                showAlert() {
                    alert("1");
                }
            }
        });
    </script>
</body>

</html>
