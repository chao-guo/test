<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../vue.js"></script>
    <title>天气</title>
</head>

<body>
    <div id="root">
        <h2>今天天气{{info}}</h2>
        <button @click="change()">切换</button><br>
        <h2>a的值是{{numbers.a}}</h2>
        <h2>b的值是{{numbers.b}}</h2>
        <button @click="numbers.a++">a+1</button>
        <button @click="numbers.b++">b+1</button>
    </div>
    <script>
        Vue.config.productionTip = false;
        new Vue({
            el: "#root",
            data() {
                return {
                    isHot: true,
                    numbers: {
                        a: 1,
                        b: 1
                    }
                }
            },
            computed: {
                info() {
                    return this.isHot ? "炎热" : "凉爽";
                }
            },
            methods: {
                change() {
                    this.isHot = !this.isHot;
                }
            },
            watch: {
                isHot: {
                    immediate: true,
                    handler(newvalue, old) {
                        console.log("isHot has been changed", ",newvalue:", newvalue, ",old:", old)
                    }
                },
                "numbers.a": {
                    handler(newvalue, old) {
                        console.log("numbers.a has been changed", ",newvalue:", newvalue, ",old:", old)
                    }
                },
                numbers: {
                    deep: true,
                    handler(newvalue, old) {
                        console.log("numbers has been changed", ",newvalue:", newvalue, ",old:", old)
                    }
                }

            }
        })
    </script>
</body>

</html>
